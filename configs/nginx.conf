upstream tei_backend {
    server tei-embedding:80;
    keepalive 32;
}

upstream rerank_backend {
    server tei-rerank-adapter:80;
    keepalive 32;
}

server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;

    # 彻底关闭缓冲，确保打字机流式输出毫秒级响应
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header X-Accel-Buffering no;
    
    # 防止大模型长文思考超时
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # 引入 Docker 内部的标准 DNS 解析器
    # 127.0.0.11 是 Docker 桥接网络的固定内置 DNS IP，valid=10s 确保容器重启 IP 变更时能自动刷新
    resolver 127.0.0.11 valid=10s ipv6=off;

    # healthcheck
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # =========================================================================
    # 1. 大模型 (Chat & Models) -> 动态可选服务 (llama-brain)
    # =========================================================================
    # 使用变量 $llama_server 实现延迟动态解析
    location ~ ^/v1/(chat/completions|models) {
        set $llama_server "http://llama-brain:8080";
        proxy_pass $llama_server$request_uri;

        # 优雅降级：如果 llama-brain 没开，拦截 502 错误，返回标准 JSON 而不是崩掉 Nginx
        proxy_intercept_errors on;
        error_page 502 503 504 = @llama_down;
    }

    # 当 llama-brain 处于离线状态时返回的兜底友好提示
    location @llama_down {
        default_type application/json;
        return 503 '{"error": {"message": "llama-brain (本地算力脑) 当前处于离线/休眠状态，请检查容器是否已启动。", "type": "offline_backend_error", "code": 503}}';
    }

    # =========================================================================
    # 2. 向量嵌入 (Embeddings) -> 常开服务 (tei-embedding)
    # =========================================================================
    location /v1/embeddings {
        proxy_pass http://tei_backend/v1/embeddings;
    }

    # =========================================================================
    # 3. 向量重排 (Rerank) -> 常开服务 (tei-rerank)
    # =========================================================================
    location /v1/rerank {
        proxy_pass http://rerank_backend/rerank;
    }
}