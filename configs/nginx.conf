upstream llama_backend {
    server llama-brain:8080;
    keepalive 32;
}

upstream tei_backend {
    server tei-embedding:80;
    keepalive 32;
}

upstream rerank_backend {
    server tei-rerank-adapter:80;
    keepalive 32;
}

server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;

    # 彻底关闭缓冲，确保打字机流式输出毫秒级响应
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header X-Accel-Buffering no;
    
    # 防止大模型长文思考超时
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # healthcheck
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 1. 大模型 (Chat & Models) -> llama-brain
    location /v1/chat/completions {
        proxy_pass http://llama_backend/v1/chat/completions;
    }
    location /v1/models {
        proxy_pass http://llama_backend/v1/models;
    }

    # 2. 向量嵌入 (Embeddings) -> tei-embedding
    location /v1/embeddings {
        proxy_pass http://tei_backend/v1/embeddings;
    }

    # 3. 向量重排 (Rerank) -> tei-rerank
    location /v1/rerank {
        proxy_pass http://rerank_backend/rerank;
    }
}